<!doctype html><html lang="uk"><head><meta charset="utf-8"><style>body{width:340px;max-height:560px;overflow:auto;margin:0;padding:18px;background:#111419;color:#f3f6f8;font:13px system-ui}h1{font-size:16px;margin:0 0 4px}#title{color:#929aa4;font-size:11px;margin-bottom:14px}.row{display:flex;align-items:center;justify-content:space-between;margin:10px 0}input[type=number]{width:68px;padding:7px;background:#090b0e;border:1px solid #343a42;border-radius:8px;color:white}.voices{border-top:1px solid #2d333a;margin:14px 0;padding-top:10px}.voice{display:flex;gap:9px;align-items:center;padding:7px 2px}.voice input{accent-color:#c9ff4a}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button,#save{padding:10px;border:0;border-radius:8px;font-weight:700;cursor:pointer}.primary{background:#c9ff4a;color:#0b0d0f}.secondary{background:#292f36;color:white}small{display:block;color:#8b929c;margin-top:12px;line-height:1.4}</style></head><body><h1>HLS Grabber Bridge</h1><div id="title">Читаю сторінку…</div><label class="row"><span>Перехоплення</span><input id="enabled" type="checkbox"></label><label class="row"><span>Порт Grabber</span><input id="port" type="number" min="1" max="65535"></label><button id="save" class="secondary">Зберегти порт</button><div class="voices" id="voices"></div><div class="actions"><button id="scan" class="primary">Сканувати вибрані</button><button id="cancel" class="secondary">Зупинити</button></div><small id="status">Вибери озвучення, які потрібно просканувати.</small><script src="popup.js"></script></body></html>
