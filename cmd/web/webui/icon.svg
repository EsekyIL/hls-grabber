<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="HLS Grabber">
  <!--
    Іконка вкладки. Читатись мусить на 16 пікселях, тож усе зайве прибрано:
    жодних тонких ліній, дрібних деталей і тексту — на такому розмірі з них
    лишається сіра пляма.

    Знак — стрілка вниз у лоток: «забрати собі». Саме те, що робить програма,
    і воно впізнається без підпису, на відміну від літери H, яка на вкладці
    нічим не відрізняється від сусідніх.

    Кольори ті самі, що в логотипі панелі: фіолетово-рожевий градієнт і
    білий знак.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#b54dff"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <g stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Стрижень і вістря стрілки. Товщина 7 при полі 64 — на 16px це
         майже два пікселі, тобто знак лишається суцільним. -->
    <path d="M32 13v22"/>
    <path d="M21 27l11 11 11-11"/>
    <!-- Лоток: розімкнутий згори, щоб стрілка читалась як така, що входить
         усередину, а не впирається в риску. -->
    <path d="M15 44v6h34v-6"/>
  </g>
</svg>
